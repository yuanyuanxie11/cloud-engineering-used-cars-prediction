<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Used Car Price Predictor</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #657086;
        --line: #d9dee8;
        --accent: #1769aa;
        --accent-dark: #0d4778;
        --ok: #0f766e;
        --warn: #b45309;
        --bad: #b91c1c;
        --soft: #eef4fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 36px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.65rem, 2.8vw, 2.55rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .badge {
        border: 1px solid #bfd0e5;
        border-radius: 999px;
        background: var(--soft);
        color: #214a76;
        font-size: 0.82rem;
        font-weight: 750;
        padding: 5px 10px;
      }

      .status {
        min-width: 170px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: right;
      }

      .status strong {
        display: block;
        color: var(--ink);
        font-size: 1rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.8fr);
        gap: 18px;
        align-items: start;
      }

      section,
      aside {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .form-panel {
        padding: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .sample-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        margin-bottom: 18px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid #c7cfdd;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 0.96rem;
        padding: 9px 10px;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.14);
        outline: none;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        min-height: 42px;
        padding: 10px 16px;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: progress;
        opacity: 0.65;
      }

      .ghost {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }

      .ghost:hover {
        background: #f0f3f8;
      }

      .result-panel {
        padding: 18px;
        position: sticky;
        top: 18px;
      }

      .price {
        margin: 4px 0 8px;
        color: var(--ok);
        font-size: clamp(2rem, 4.8vw, 3.2rem);
        font-weight: 850;
        letter-spacing: 0;
      }

      .meta {
        display: grid;
        gap: 8px;
        margin: 16px 0;
      }

      .meta div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .meta strong {
        color: var(--ink);
        font-weight: 700;
        text-align: right;
      }

      pre {
        overflow: auto;
        max-height: 220px;
        margin: 0;
        border: 1px solid #d7dfeb;
        border-radius: 6px;
        background: #0f172a;
        color: #e5eefc;
        font-size: 0.82rem;
        line-height: 1.45;
        padding: 12px;
      }

      .message {
        display: none;
        margin-top: 14px;
        border-radius: 6px;
        padding: 11px 12px;
        font-size: 0.93rem;
      }

      .message.show {
        display: block;
      }

      .message.warn {
        background: #fff7ed;
        color: var(--warn);
        border: 1px solid #fed7aa;
      }

      .message.bad {
        background: #fef2f2;
        color: var(--bad);
        border: 1px solid #fecaca;
      }

      details {
        margin-top: 16px;
      }

      summary {
        cursor: pointer;
        color: var(--accent);
        font-weight: 750;
        margin-bottom: 8px;
      }

      @media (max-width: 880px) {
        header,
        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        .status {
          text-align: left;
        }

        .layout,
        .grid,
        .sample-row {
          grid-template-columns: 1fr;
        }

        .result-panel {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Used Car Price Predictor</h1>
          <p class="subtitle">Estimate a used vehicle price from the deployed AWS inference model.</p>
          <div class="badge-row" aria-label="Architecture summary">
            <span class="badge">API Gateway</span>
            <span class="badge">Lambda</span>
            <span class="badge">S3 model artifacts</span>
          </div>
        </div>
        <div class="status" aria-live="polite">
          Endpoint status
          <strong id="statusText">Ready</strong>
        </div>
      </header>

      <div class="layout">
        <section class="form-panel" aria-labelledby="formTitle">
          <h2 id="formTitle">Vehicle Details</h2>
          <form id="predictForm">
            <div class="sample-row">
              <label>
                Demo sample
                <select id="sampleSelect">
                  <option value="toyota_camry">Toyota sedan, CA</option>
                  <option value="honda_suv">Honda SUV, WA</option>
                  <option value="ford_truck">Ford truck, TX</option>
                </select>
              </label>
              <button class="ghost" id="loadSampleButton" type="button">Load Sample</button>
            </div>
            <div class="grid">
              <label>
                Manufacturer
                <select name="manufacturer">
                  <option>toyota</option>
                  <option>ford</option>
                  <option>honda</option>
                  <option>chevrolet</option>
                  <option>nissan</option>
                  <option>bmw</option>
                  <option>mercedes-benz</option>
                  <option>jeep</option>
                  <option>subaru</option>
                  <option>volkswagen</option>
                  <option>hyundai</option>
                  <option>kia</option>
                </select>
              </label>
              <label>
                Year
                <input name="year" type="number" min="1900" max="2026" value="2018" required />
              </label>
              <label>
                Odometer
                <input name="odometer" type="number" min="0" step="100" value="45000" required />
              </label>
              <label>
                Condition
                <select name="condition">
                  <option>excellent</option>
                  <option>good</option>
                  <option>like new</option>
                  <option>fair</option>
                  <option>new</option>
                  <option>salvage</option>
                </select>
              </label>
              <label>
                Cylinders
                <select name="cylinders">
                  <option>4 cylinders</option>
                  <option>6 cylinders</option>
                  <option>8 cylinders</option>
                  <option>other</option>
                  <option>3 cylinders</option>
                  <option>5 cylinders</option>
                </select>
              </label>
              <label>
                Fuel
                <select name="fuel">
                  <option>gas</option>
                  <option>diesel</option>
                  <option>hybrid</option>
                  <option>electric</option>
                  <option>other</option>
                </select>
              </label>
              <label>
                Transmission
                <select name="transmission">
                  <option>automatic</option>
                  <option>manual</option>
                  <option>other</option>
                </select>
              </label>
              <label>
                Drive
                <select name="drive">
                  <option>fwd</option>
                  <option>rwd</option>
                  <option>4wd</option>
                </select>
              </label>
              <label>
                Type
                <select name="type">
                  <option>sedan</option>
                  <option>SUV</option>
                  <option>truck</option>
                  <option>pickup</option>
                  <option>coupe</option>
                  <option>hatchback</option>
                  <option>wagon</option>
                  <option>van</option>
                  <option>convertible</option>
                  <option>mini-van</option>
                </select>
              </label>
              <label>
                Paint color
                <select name="paint_color">
                  <option>white</option>
                  <option>black</option>
                  <option>silver</option>
                  <option>grey</option>
                  <option>blue</option>
                  <option>red</option>
                  <option>green</option>
                  <option>brown</option>
                  <option>custom</option>
                </select>
              </label>
              <label>
                State
                <select name="state" id="stateSelect">
                  <option value="ca">CA</option>
                  <option value="ny">NY</option>
                  <option value="tx">TX</option>
                  <option value="fl">FL</option>
                  <option value="wa">WA</option>
                  <option value="il">IL</option>
                  <option value="az">AZ</option>
                  <option value="co">CO</option>
                  <option value="ga">GA</option>
                  <option value="nc">NC</option>
                  <option value="oh">OH</option>
                  <option value="mi">MI</option>
                  <option value="pa">PA</option>
                  <option value="or">OR</option>
                  <option value="va">VA</option>
                </select>
              </label>
              <label>
                Title status
                <select name="title_status">
                  <option>clean</option>
                  <option>rebuilt</option>
                  <option>salvage</option>
                  <option>lien</option>
                  <option>missing</option>
                  <option>parts only</option>
                </select>
              </label>
              <label>
                Region
                <select name="region" id="regionSelect"></select>
              </label>
            </div>

            <div class="actions">
              <button id="predictButton" type="submit">Predict Price</button>
              <button class="ghost" id="resetButton" type="button">Reset Sample</button>
            </div>
          </form>
          <div id="message" class="message" role="alert"></div>
        </section>

        <aside class="result-panel" aria-labelledby="resultTitle">
          <h2 id="resultTitle">Prediction</h2>
          <div class="price" id="price">$--</div>
          <div class="meta">
            <div><span>Model</span><strong id="model">--</strong></div>
            <div><span>Run ID</span><strong id="runId">--</strong></div>
            <div><span>HTTP status</span><strong id="httpStatus">--</strong></div>
          </div>
          <details>
            <summary>Technical details</summary>
            <pre id="payload">{}</pre>
          </details>
        </aside>
      </div>
    </main>

    <script>
      const samples = {
        toyota_camry: {
          manufacturer: "toyota",
          year: 2018,
          odometer: 45000,
          condition: "excellent",
          cylinders: "4 cylinders",
          fuel: "gas",
          transmission: "automatic",
          drive: "fwd",
          type: "sedan",
          paint_color: "white",
          state: "ca",
          title_status: "clean",
          region: "los angeles",
        },
        honda_suv: {
          manufacturer: "honda",
          year: 2020,
          odometer: 52000,
          condition: "good",
          cylinders: "4 cylinders",
          fuel: "gas",
          transmission: "automatic",
          drive: "4wd",
          type: "SUV",
          paint_color: "silver",
          state: "wa",
          title_status: "clean",
          region: "seattle-tacoma",
        },
        ford_truck: {
          manufacturer: "ford",
          year: 2017,
          odometer: 82000,
          condition: "good",
          cylinders: "8 cylinders",
          fuel: "gas",
          transmission: "automatic",
          drive: "4wd",
          type: "truck",
          paint_color: "black",
          state: "tx",
          title_status: "clean",
          region: "dallas / fort worth",
        },
      };

      const form = document.querySelector("#predictForm");
      const button = document.querySelector("#predictButton");
      const resetButton = document.querySelector("#resetButton");
      const sampleSelect = document.querySelector("#sampleSelect");
      const loadSampleButton = document.querySelector("#loadSampleButton");
      const message = document.querySelector("#message");
      const stateSelect = document.querySelector("#stateSelect");
      const regionSelect = document.querySelector("#regionSelect");
      const apiEndpoint = "https://qodruw90xj.execute-api.us-east-1.amazonaws.com/predict";
      const regionsByState = {
        ca: ["los angeles", "san diego", "san francisco bay area", "sacramento"],
        ny: ["new york city", "long island", "hudson valley", "buffalo"],
        tx: ["dallas / fort worth", "houston", "austin", "san antonio"],
        fl: ["miami / dade", "orlando", "tampa bay area", "jacksonville"],
        wa: ["seattle-tacoma", "spokane", "olympic peninsula"],
        il: ["chicago", "central illinois", "springfield"],
        az: ["phoenix", "tucson", "flagstaff / sedona"],
        co: ["denver", "colorado springs", "fort collins / north CO"],
        ga: ["atlanta", "savannah / hinesville", "augusta"],
        nc: ["charlotte", "raleigh / durham / CH", "greensboro"],
        oh: ["columbus", "cleveland", "cincinnati"],
        mi: ["detroit metro", "grand rapids", "lansing"],
        pa: ["philadelphia", "pittsburgh", "harrisburg"],
        or: ["portland", "eugene", "bend"],
        va: ["washington, dc", "richmond", "norfolk / hampton roads"],
      };

      function setMessage(text, kind = "warn") {
        message.textContent = text;
        message.className = `message show ${kind}`;
      }

      function clearMessage() {
        message.textContent = "";
        message.className = "message";
      }

      function collectVehicle() {
        const data = new FormData(form);
        return {
          manufacturer: data.get("manufacturer"),
          year: Number(data.get("year")),
          odometer: Number(data.get("odometer")),
          condition: data.get("condition"),
          cylinders: data.get("cylinders"),
          fuel: data.get("fuel"),
          transmission: data.get("transmission"),
          drive: data.get("drive"),
          type: data.get("type").toLowerCase(),
          paint_color: data.get("paint_color"),
          state: data.get("state").toLowerCase(),
          title_status: data.get("title_status"),
          region: data.get("region").toLowerCase(),
        };
      }

      function fillSample(sampleKey = sampleSelect.value) {
        const sample = samples[sampleKey] || samples.toyota_camry;
        for (const [key, value] of Object.entries(sample)) {
          const field = form.elements[key];
          if (field) field.value = value;
        }
        populateRegions(sample.state, sample.region);
      }

      function populateRegions(state, selectedRegion) {
        const regions = regionsByState[state] || [];
        regionSelect.replaceChildren(
          ...regions.map((region) => {
            const option = document.createElement("option");
            option.value = region;
            option.textContent = region;
            return option;
          }),
        );
        regionSelect.value = regions.includes(selectedRegion) ? selectedRegion : regions[0] || "";
      }

      function renderResponse(body, httpStatus) {
        document.querySelector("#httpStatus").textContent = String(httpStatus);
        document.querySelector("#payload").textContent = JSON.stringify(body, null, 2);

        if (body.predictions && body.predictions.length) {
          const price = Number(body.predictions[0]);
          document.querySelector("#price").textContent = price.toLocaleString("en-US", {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: 0,
          });
        }

        document.querySelector("#model").textContent = body.model || "--";
        document.querySelector("#runId").textContent = body.run_id || "--";
      }

      function resetResult() {
        document.querySelector("#price").textContent = "$--";
        document.querySelector("#model").textContent = "--";
        document.querySelector("#runId").textContent = "--";
        document.querySelector("#httpStatus").textContent = "--";
        document.querySelector("#payload").textContent = "{}";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();
        resetResult();
        button.disabled = true;
        document.querySelector("#statusText").textContent = "Predicting";

        const vehicle = collectVehicle();
        const body = { instances: [vehicle] };

        try {
          const response = await fetch(apiEndpoint, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(body),
          });
          const text = await response.text();
          const payload = text ? JSON.parse(text) : {};
          renderResponse(payload, response.status);

          if (!response.ok) {
            document.querySelector("#statusText").textContent = "API error";
            setMessage(payload.error || "The prediction service returned an error.", "bad");
          } else {
            document.querySelector("#statusText").textContent = "Success";
          }
        } catch (error) {
          document.querySelector("#statusText").textContent = "Connection issue";
          setMessage(
            "The prediction service is temporarily unavailable. Refresh the page and try again.",
            "bad",
          );
          document.querySelector("#payload").textContent = String(error);
        } finally {
          button.disabled = false;
        }
      });

      resetButton.addEventListener("click", fillSample);
      loadSampleButton.addEventListener("click", () => fillSample());
      stateSelect.addEventListener("change", () => populateRegions(stateSelect.value));
      populateRegions(samples.toyota_camry.state, samples.toyota_camry.region);
      fillSample();
    </script>
  </body>
</html>
